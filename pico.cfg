MEMORY {
  ZP:		start = $0000, size = $0100, type = rw;
  INPUT_BUFFER: start = $0300, size = $0100, type = rw, file = "";
  BASROM:   start = $A000, size = $2000, fill = yes, file = %O;
  C000:     start = $C000, size = $1000, fill = yes, file = %O;
  D000:     start = $D000, size = $1000, fill = yes, file = %O;
  KERNAL:   start = $E000, size = $1000, fill = yes, file = %O;
  IO:       start = $F000, size = $0E00, fill = yes, file = %O;
  WOZMON:   start = $FE00, size = $01FA, fill = yes, file = %O;
  RESETVEC: start = $FFFA, size = $0006, fill = yes, file = %O;
  DUMMY:    start = $0000, size = $00FF, file = "";
}
SEGMENTS {
  ZEROPAGE:     load = ZP,           type = zp;
  INPUT_BUFFER: load = INPUT_BUFFER, type = rw;
  HEADER:       load = BASROM,       type = ro;
  VECTORS:      load = BASROM,       type = ro;
  KEYWORDS:     load = BASROM,       type = ro;
  ERROR:        load = BASROM,       type = ro;
  CODE:         load = BASROM,       type = ro;
  C000:         load = C000,         type = ro;
  D000:         load = D000,         type = ro;

  IO:           load = IO,           type = rw;
  KERNAL:       load = KERNAL,       type = ro;
  CHRGET:       load = BASROM,       type = ro;
  INIT:         load = KERNAL,       type = ro;
  EXTRA:        load = BASROM,       type = ro;
  DUMMY:        load = DUMMY;        # don't include

  BIOS:         load = KERNAL,       type = ro;
  WOZMON:       load = WOZMON,       type = ro;
  RESETVEC:     load = RESETVEC,     type = ro;
}
